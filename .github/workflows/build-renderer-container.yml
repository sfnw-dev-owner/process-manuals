name: Build and Push Docker renderer Image

on:
  push:
    branches:
      - main
    paths:
      - render/Dockerfile
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/renderer

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build timestamp
        id: timestamp
        run: echo "tag=$(date -u '+%Y%m%dT%H%M%S')" | tee -a "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ""
          file: render/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.timestamp.outputs.tag }}
          labels: |
            # Clear upstream labels since docker only supports overriding, not deleting.
            maintainer=
            org.opencontainers.image.authors=
            org.opencontainers.image.description=
            org.opencontainers.image.licenses=
            org.opencontainers.image.title=
            org.opencontainers.image.vendor=
            org.opencontainers.image.version=
            org.pandoc.author=
            org.pandoc.maintainer=
            org.pandoc.version=
            # Set our own labels.
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.tag }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/blob/main/render/Dockerfile
          cache-from: type=gha
          cache-to: type=gha

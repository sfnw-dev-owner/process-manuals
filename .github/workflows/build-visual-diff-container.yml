name: Build and Push Docker visual-diff Image

on:
  push:
    branches:
      - main
      - ami/visual-diff-container
    paths:
      - 'render/visual-diff/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/visual-diff

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build timestamp
        id: timestamp
        run: echo "tag=$(date -u '+%Y%m%dT%H%M%S')" | tee -a "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: render/visual-diff
          file: render/visual-diff/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.timestamp.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.tag }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/blob/main/render/visual-diff/Dockerfile
          cache-from: type=gha
          cache-to: type=gha
